{% extends "base.html" %}
{% load i18n %}
{% load widget_tweaks %}

{% block navigation_top %}{% include 'general-nav.html' %}{% endblock %}

{% block main-content %}
<main class="wrap commerce-page portal-page form-page">
    <div class="page-heading"><div><p class="eyebrow">{% translate "Supply Center" %}</p><h1 class="lao-noto">{% translate "Create listing" %}</h1></div></div>
    <form method="post" class="form-panel portal-form">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{% render_field field %}{% for error in field.errors %}<span class="form-error">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="primary-button" type="submit">{% if object %}{% translate "Save changes" %}{% else %}{% translate "Submit listing" %}{% endif %}</button></form>
</main>
{% endblock %}
