{% load static %}
{% load i18n %}
{% load custom_tags %}
<div class="w3-top w3-center" style="z-index:99999 !important;">
  <div class="w3-bar glass" id="myNavbar">
    <a href="{% url 'users:home' %}"
      class="w3-bar-item w3-button w3-hover-none w3-hover-text-primary w3-padding-small"
      style="display: flex; align-items: center; height: 50px;">
      <img src="{% static 'images/logo-laoproduct.png' %}" alt="{% trans 'Lao Product logo' %}" style="height:45px; border-radius: 8px;" class="w3-white">
      <span class="lao-noto w3-margin-left w3-hide-small"
        style="font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em;">
        {% trans "BACKEND STATE" %}
      </span>
    </a>

    <button class="w3-bar-item w3-button w3-right w3-hide-medium w3-hide-large nav-hamburger w3-button-outline w3-round-large"
      onclick="w3_open()" style="height: 44px; margin-left: auto; border-radius: 10px;">
      <i class="fa fa-bars"></i>
    </button>

    <div class="w3-right w3-hide-small"
      style="display: flex; align-items: center; height: 50px; gap: 4px; margin-left: auto;">

      <a href="{% url 'users:home' %}" class="w3-button w3-button-outline w3-round-large" style="font-size: 0.9rem;">
          <i class="fa-solid fa-list-check w3-margin-right"></i>
          <span>{% trans "Home" %}</span>
      </a>
      {% if user.is_authenticated and user.is_superuser %}
          <a href="{% url 'admin:index' %}" class="w3-button w3-button-outline w3-round-large" style="font-size: 0.9rem;">
              <i class="fa-solid fa-list-check w3-margin-right"></i>
              <span>{% trans "Admin" %}</span>
          </a>
      {% endif %}

          </a>
        </div>
      </div> -->

      {% include 'components/language_switcher.html' %}
      <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
        {% csrf_token %}
        <button type="submit" class="w3-button w3-text-red w3-hover-red w3-hover-text-white"
          style="padding: 8px 16px !important; margin-left: 8px; border-radius: 8px;">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </form>
    </div>
  </div>
</div>
