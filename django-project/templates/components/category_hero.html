<div class="w3-container w3-row">
    <div class="w3-col l2 m2 s12">
        {% for item in items %}
            {{item.name}}
        {% endfor %}
    </div>

    <div class="w3-col l10 m10 s12">
        {% for slide in hero_slides %}
          <div class="slide">
            <img src="{{ slide.image.url }}" alt="{{ slide.title }}">
            <div class="caption">
              {% if slide.title %}<h1>{{ slide.title }}</h1>{% endif %}
              {% if slide.subtitle %}<p>{{ slide.subtitle }}</p>{% endif %}
              {% if slide.button_url and slide.button_text %}
                <a href="{{ slide.button_url }}" class="btn btn-primary">
                  {{ slide.button_text }}
                </a>
              {% endif %}
            </div>
          </div>
        {% endfor %}
    </div>
</div>
